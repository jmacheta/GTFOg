# Workspace for the GTFOg firmware: west init -m <this repo> && west update
manifest:
  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      remote: nrfconnect
      repo-path: sdk-nrf
      revision: v3.4.0
      import: true

  self:
    path: GTFOg
