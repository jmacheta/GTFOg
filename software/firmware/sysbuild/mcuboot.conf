CONFIG_LOG=n
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
# Blink the strobe while installing an update (mcuboot_hooks/).
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_PWM=y

# USB serial recovery (mcumgr over CDC ACM): hold + while waking the device. On nRF52 MCUboot builds this on the
# legacy USB device stack; only the bootloader uses it.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_MULTITHREADING=y
CONFIG_GPIO=y
CONFIG_CONSOLE=n
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_PRODUCT="GTFOg bootloader"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0xEACD
CONFIG_USB_DEVICE_MANUFACTURER="elmaczete_customs"

# Size: the bootloader has to fit its partition.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
