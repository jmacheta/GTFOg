# C++23 with the full standard library, no exceptions or RTTI.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Logging over Segger RTT.
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_DEFERRED=y
# Our modules log at INF; Zephyr's own only warnings, which keeps their strings out of flash.
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_LOG_LEVEL_ERR=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADXL345=y
CONFIG_FPU=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y

# No 32.768 kHz crystal on the board: the low-frequency clock is the calibrated RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Settings in the storage partition, used for Bluetooth bonds.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Bluetooth LE peripheral.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GTFOg"
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_ASSERT=n
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="GTFOg"
CONFIG_BT_DIS_MANUF_NAME_STR="elmaczete_customs"

# USB device stack with DFU into slot 1; MCUboot installs the image on the next boot.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_DFU=y
CONFIG_USBD_DFU_FLASH=y
CONFIG_USBD_DFU_FLASH_SLOT0=n
CONFIG_USBD_DFU_FLASH_SLOT1=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_HWINFO=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_BOOTLOADER_MCUBOOT=y
