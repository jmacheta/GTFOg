# C++23 with the full standard library, no exceptions or RTTI.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# No console: no logging or boot banner. Turn CONFIG_LOG and CONFIG_LOG_BACKEND_RTT on to debug over RTT.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_FPU=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y
# Hardware watchdog, fed by the battery thread.
CONFIG_WATCHDOG=y

# No 32.768 kHz crystal on the board: the low-frequency clock is the calibrated RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Settings in the storage partition: Bluetooth bonds and the device settings.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Bluetooth LE peripheral.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GTFOg"
CONFIG_BT_SMP=y
# LE Secure Connections only: legacy pairing can be cracked from a passive capture.
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SETTINGS=y
# Database hash and Service Changed: bonded phones refresh their GATT cache after a firmware update.
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_ASSERT=n
CONFIG_BT_MAX_CONN=1
# One connection at a time, but remember several phones and PCs; the oldest bond goes when full.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# New pairings only in the first minutes after boot (ble.cpp); bonded phones always reconnect.
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# Large ATT MTU and data length, so one notification carries 40 accelerometer samples.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="GTFOg"
CONFIG_BT_DIS_MANUF_NAME_STR="elmaczete_customs"

CONFIG_BOOTLOADER_MCUBOOT=y

# Firmware update over Bluetooth (mcumgr SMP into slot 1); only from a paired phone.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
